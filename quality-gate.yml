name: The Squad quality gate
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit production inputs and Firebase guardrails
        run: npm run audit:production
      - name: Run automated smoke and security guard checks
        run: npm test
      - name: Build optimized static site
        run: npm run build
      - name: Verify build output
        run: test -s dist/index.html
