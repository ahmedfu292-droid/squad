<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Squad</title>
<meta name="theme-color" content="#050505">
<style>
html,body{height:100%;margin:0;background:#050505;color:#f3d77a;font:16px/1.8 system-ui,Segoe UI,Tahoma,sans-serif}
body{display:grid;place-items:center;text-align:center;background:radial-gradient(60% 40% at 50% 85%,#3a2a08 0,#050505 70%)}
h1{margin:12px 0 4px;font-size:34px;color:#f1e3c4}
p{margin:6px 16px;color:#b8a074}
#msg{display:none;max-width:520px;margin:18px auto 0;padding:14px 16px;border:1px solid #b8860b;border-radius:14px;background:#17130b}
button{margin-top:10px;padding:9px 18px;border:1px solid #d9b76d;border-radius:9px;background:#d9b76d;color:#17130b;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<main>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none"><path d="M32 4 56 18v28L32 60 8 46V18z" stroke="#d9b76d" stroke-width="3" stroke-linejoin="round"/><path d="M40 22c-3-3-16-4-16 4 0 9 17 5 17 14 0 8-13 7-17 3" stroke="#d9b76d" stroke-width="5" stroke-linecap="round"/></svg>
<h1>The Squad</h1>
<p id="st">جاري التحميل…</p>
<div id="msg" role="alert"></div>
</main>
<script>
(async()=>{
  const go=()=>location.replace('site/'+location.search+location.hash);
  const fail=t=>{const m=document.getElementById('msg');m.style.display='block';m.innerHTML=t+'<br><button onclick="location.reload()">إعادة المحاولة</button>';document.getElementById('st').textContent=''};
  // 1) امسح أي Service Worker وكاش قديم كان بيعرض نسخة قديمة من الموقع
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if(window.caches){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}
  // 2) اتأكد إن مجلد site موجود على GitHub وبعدين ادخل عليه
  try{
    const r=await fetch('site/index.html',{cache:'no-store'});
    if(r.ok)return go();
    fail('مجلد <b>site</b> مش موجود على GitHub. ارفع مجلد site كامل (فيه index.html) جنب الملف ده.');
  }catch(e){
    fail('تعذر الاتصال. راجع الإنترنت وحاول تاني.');
  }
})();
</script>
</body>
</html>
