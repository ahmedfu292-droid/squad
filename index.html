<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d77a"/><stop offset="1" stop-color="#b8860b"/></linearGradient></defs></svg>

<div id="splash"><svg class="logo" viewBox="0 0 64 64" fill="none"><path d="M32 4 56 18v28L32 60 8 46V18z" stroke="url(#lg)" stroke-width="3" stroke-linejoin="round"/><path d="M40 22c-3-3-16-4-16 4 0 9 17 5 17 14 0 8-13 7-17 3" stroke="url(#lg)" stroke-width="5" stroke-linecap="round"/></svg><h1>The Squad</h1><p>أكثر من مجرد محادثة</p><i class="bar"></i></div>

<main id="auth" class="v2" hidden>
 <div class="ahero">
  <svg class="logo" viewBox="0 0 64 64" fill="none"><path d="M32 4 56 18v28L32 60 8 46V18z" stroke="url(#lg)" stroke-width="3" stroke-linejoin="round"/><path d="M40 22c-3-3-16-4-16 4 0 9 17 5 17 14 0 8-13 7-17 3" stroke="url(#lg)" stroke-width="5" stroke-linecap="round"/></svg>
  <h1>The Squad</h1>
  <p class="tag">شلتك كلها في مكان واحد</p>
  <ul class="feats"><li><b>💬</b>محادثات وجروبات</li><li><b>📞</b>مكالمات صوت وفيديو</li><li><b>☕</b>كافيه ثلاثي الأبعاد</li><li><b>🔒</b>خصوصيتك في إيدك</li></ul>
 </div>
 <div class="card">
  <button id="abk" class="gh" type="button" hidden>← رجوع للحساب الحالي</button>
  <div class="tb"><button data-m="in" class="on">دخول</button><button data-m="up">حساب جديد</button></div>
  <section id="vin">
   <h2 class="ah2">أهلاً بيك تاني 👋</h2><p class="mu sub">ادخل برقمك الخاص أو باسم المستخدم</p>
   <label>رقمك الخاص أو اسم المستخدم<input id="lid" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="رقمك الخاص أو اسم المستخدم" dir="auto"></label>
   <label>كلمة السر<div class="row"><input id="pw" type="password" autocomplete="current-password" placeholder="كلمة السر"><button id="eye" class="ic" type="button" title="إظهار">👁</button></div></label>
   <button id="go" class="pri">دخول</button>
  </section>
  <section id="vup" hidden></section>
  <p id="aerr" role="alert"></p>
  <section id="vacc" hidden></section>
 </div>
</main>

<div id="app" hidden>
 <aside id="side">
  <header><svg class="logo sm" viewBox="0 0 64 64" fill="none"><path d="M32 4 56 18v28L32 60 8 46V18z" stroke="url(#lg)" stroke-width="4" stroke-linejoin="round"/><path d="M40 22c-3-3-16-4-16 4 0 9 17 5 17 14 0 8-13 7-17 3" stroke="url(#lg)" stroke-width="6" stroke-linecap="round"/></svg><h2>The Squad</h2><button id="gear" class="ic" title="الإعدادات">⚙️</button><button id="plus" class="ic" title="جديد"></button></header>

   <div id="list"></div>
  </div>
  <div id="oth" hidden></div>

 </aside>
 <section id="chat">

  <div class="cv">
   <header><button id="bk" class="ic"></button><div id="ct"></div><button id="cla" class="ic" title="مكالمة صوتية"></button><button id="clv" class="ic" title="مكالمة فيديو"></button><button id="mn" class="ic"></button></header>
   <div id="cb" hidden></div>
   <div id="ms"></div>
   <div id="rp" hidden><span></span><button id="xr">✕</button></div>
   <footer><button id="em" class="ic"></button><button id="ph" class="ic"></button><textarea id="in" rows="1" placeholder="اكتب رسالة..."></textarea><button id="vn" class="ic"></button><button id="snd" class="ic pri"></button></footer>
   <input id="pf" type="file" accept="image/*" hidden>
  </div>
 </section>

<script>
/* تحديث تلقائي: لما ترفع نسخة جديدة الموقع بيتحدّث لوحده */
(()=>{const F=['index.html','app.js','stories.js','calls.js','cafe.js','extras.js','games.js','channel.js','cafe2.js','community.js','plus.js','bot.js','cafe3.js','theme.js','look.js','chatx.js','settings.js','ads.js','accounts.js','acct.js','auth.js','auth.css','ui2.js','ui2.css','v27.css','profile.js','world.js','district-core.js','district.js','cinema.js','time.js','welcome.js','luxe.js','luxe.css','gold.css','push.js','squad.css','firebase-config.js'];let base=null;
const chk=async()=>{try{const t=(await Promise.all(F.map(f=>fetch(f,{cache:'no-store'}).then(r=>r.text())))).map(s=>s.length+':'+[...s].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,7)).join();
if(base===null)base=t;else if(t!=base){const a=document.activeElement;if(a&&a.value)return;caches.keys().then(k=>k.forEach(x=>caches.delete(x)));const e=document.getElementById('ts');if(e){e.textContent='فيه تحديث جديد، بيتحمّل...';e.hidden=false}setTimeout(()=>location.reload(),1200)}}catch(e){}};
setTimeout(chk,4000);setInterval(chk,12e4);document.addEventListener('visibilitychange',()=>document.hidden||chk())})();
</script>
